<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播排期日历看板 · 钉钉自动同步</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="card topbar">
      <div>
        <div class="brand-row">
          <h1 class="brand-title">直播排期日历看板</h1>
          <span id="syncBadge" class="pill success">加载中…</span>
          <span id="syncTimeBadge" class="pill">同步时间：--</span>
        </div>
        <p class="brand-sub">
          核心信息一目了然：时间段 · 主题 · 19楼 / 21楼并行直播间 · 讲师 / 主持 / 运营 · 邀约状态 · 自动冲突预警
        </p>
      </div>

      <div class="action-group">
        <a id="sourceLink" class="btn" target="_blank" rel="noopener noreferrer" href="https://alidocs.dingtalk.com/i/nodes/MNDoBb60VLrYNqLqInx6PzPA8lemrZQ3?utm_scene=person_space&iframeQuery=viewId%3Dc9vuiLa%26sheetId%3DAEFsFrm">
          打开钉钉原表 ↗
        </a>
        <button id="copyIcsUrlBtn" class="btn" type="button">复制 .ics 订阅链接</button>
        <a id="downloadIcsLink" class="btn btn-primary" href="./calendar.ics" download="直播排期日历.ics">下载 .ics</a>
        <label class="btn" title="临时导入新导出的钉钉 CSV 在本地浏览器预演">
          导入 CSV 预演
          <input id="csvInput" type="file" accept=".csv,text/csv" hidden />
        </label>
        <button id="themeBtn" class="btn" type="button" title="切换浅色 / 深色模式">深色模式</button>
      </div>
    </header>

    <!-- KPI Summary -->
    <section class="kpi-grid" id="kpiBar"></section>

    <!-- Controls & Filters -->
    <section class="card controls">
      <div class="controls-top">
        <div class="segmented" role="tablist" aria-label="视图切换">
          <button type="button" class="seg-btn active" data-view="month">月历总览</button>
          <button type="button" class="seg-btn" data-view="week">周 · 直播间并行</button>
          <button type="button" class="seg-btn" data-view="agenda">日程列表 / 排查</button>
        </div>

        <div class="nav-bar">
          <button id="prevBtn" class="btn" type="button">← 上一周期</button>
          <div id="periodTitle" class="period-title">--</div>
          <button id="nextBtn" class="btn" type="button">下一周期 →</button>
          <button id="todayBtn" class="btn btn-ghost" type="button">回到本月</button>
          <span id="quickMonths"></span>
        </div>
      </div>

      <div class="filters-row">
        <input id="searchInput" class="input search-input" type="search" placeholder="搜索主题 / 讲师 / 主持 / 运营 / 视频号 / APP…" />

        <select id="roomFilter" class="select">
          <option value="">全部直播间</option>
        </select>

        <select id="typeFilter" class="select">
          <option value="">全部直播类型</option>
        </select>

        <select id="opsFilter" class="select">
          <option value="">全部运营</option>
        </select>

        <select id="inviteFilter" class="select">
          <option value="">全部邀约状态</option>
          <option value="已邀约">已邀约</option>
          <option value="未邀约">未邀约</option>
          <option value="__EMPTY__">未填写</option>
        </select>

        <label class="check-pill">
          <input id="conflictOnly" type="checkbox" />
          <span>仅看冲突 / 异常</span>
        </label>

        <button id="resetBtn" class="btn btn-ghost" type="button">重置</button>
      </div>

      <div class="legend-row" id="legendBar"></div>
    </section>

    <!-- Undated Events Alert Banner -->
    <section id="anomalyBanner" class="card anomaly-banner hidden"></section>

    <!-- Calendar View Container -->
    <main id="calendarRoot" class="card calendar-shell"></main>

    <footer class="footer-note">
      由 GitHub Actions 自动同步钉钉 AI 表格并发布至 GitHub Pages · 订阅地址：<code>calendar.ics</code>
    </footer>
  </div>

  <!-- Detail Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-head">
        <div>
          <div id="modalBadges" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
          <h2 id="modalTitle" class="modal-title"></h2>
        </div>
        <button id="closeModal" class="modal-close" type="button" aria-label="关闭">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Local file:// fallback data bundle generated by sync_dingtalk.py -->
  <script src="./data/schedule-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
