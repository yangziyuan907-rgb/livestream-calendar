<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播排期日历看板</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Lock Screen (shown when AES-256-GCM encrypted data requires password) -->
  <div id="lockScreen" class="lock-screen hidden">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div>
        <h1 class="lock-title">直播排期日历看板</h1>
        <p class="lock-desc">内部排期数据已启用 AES-256 端到端加密保护，请输入团队访问密码解锁查看。</p>
      </div>

      <form id="unlockForm" class="lock-form">
        <div class="pw-wrap">
          <input id="passwordInput" class="pw-input" type="password" placeholder="请输入访问密码" autocomplete="current-password" required />
          <button id="togglePwBtn" class="pw-toggle" type="button">显示</button>
        </div>
        <label class="remember-row">
          <input id="rememberPw" type="checkbox" checked />
          <span>在此设备记住密码（下次打开直接查看）</span>
        </label>
        <div id="lockError" class="lock-error hidden"></div>
        <button id="unlockBtn" class="btn btn-primary lock-submit" type="submit">解锁查看</button>
      </form>

      <div class="lock-foot">密码仅在本地浏览器解密使用，不会上传至第三方服务器</div>
    </div>
  </div>

  <!-- Main Calendar App (hidden until unlocked in encrypted mode) -->
  <div id="appShell" class="app-shell hidden">
    <!-- Top Bar -->
    <header class="card topbar">
      <div>
        <div class="brand-row">
          <h1 class="brand-title">直播排期日历看板</h1>
          <span id="syncBadge" class="pill success">加载中…</span>
          <span id="syncTimeBadge" class="pill">同步时间：--</span>
          <span id="encBadge" class="pill success hidden">🔒 AES-256 已加密</span>
          <button id="refreshBtn" class="btn btn-compact" type="button" title="拉取最新同步的排期数据">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span id="refreshBtnLabel">刷新</span>
          </button>
        </div>
        <p class="brand-sub">
          核心信息一目了然：时间段 · 主题 · 19楼 / 21楼并行直播间 · 讲师 / 主持 / 运营 · 邀约状态 · 自动冲突预警
        </p>
      </div>

      <div class="action-group">
        <a id="sourceLink" class="btn hidden" target="_blank" rel="noopener noreferrer" href="#">
          打开钉钉原表 ↗
        </a>
        <button id="copyIcsUrlBtn" class="btn hidden" type="button">复制 .ics 订阅链接</button>
        <button id="downloadIcsBtn" class="btn btn-primary" type="button">下载 .ics</button>
        <label class="btn" title="临时导入新导出的钉钉 CSV 在本地浏览器预演">
          导入 CSV 预演
          <input id="csvInput" type="file" accept=".csv,text/csv" hidden />
        </label>
        <button id="themeBtn" class="btn" type="button" title="切换浅色 / 深色模式">深色模式</button>
        <button id="lockBtn" class="btn hidden" type="button" title="退出登录并清除本机记住的密码">退出</button>
      </div>
    </header>

    <!-- Controls & Filters -->
    <section class="card controls">
      <div class="controls-top">
        <div class="segmented" role="tablist" aria-label="视图切换">
          <button type="button" class="seg-btn active" data-view="month">月历总览</button>
          <button type="button" class="seg-btn" data-view="week">周 · 直播间并行</button>
          <button type="button" class="seg-btn" data-view="agenda">日程列表 / 排查</button>
        </div>

        <div class="nav-bar">
          <button id="prevBtn" class="btn" type="button">← 上一周期</button>
          <div id="periodTitle" class="period-title">--</div>
          <button id="nextBtn" class="btn" type="button">下一周期 →</button>
          <button id="todayBtn" class="btn btn-ghost" type="button">回到今天</button>
          <span id="quickMonths"></span>
        </div>
      </div>

      <div class="filters-row">
        <input id="searchInput" class="input search-input" type="search" placeholder="搜索主题 / 讲师 / 主持 / 运营 / 视频号 / APP…" />

        <select id="roomFilter" class="select">
          <option value="">全部直播间</option>
        </select>

        <select id="typeFilter" class="select">
          <option value="">全部直播类型</option>
        </select>

        <select id="opsFilter" class="select">
          <option value="">全部运营</option>
        </select>

        <select id="inviteFilter" class="select">
          <option value="">全部邀约状态</option>
          <option value="已邀约">已邀约</option>
          <option value="未邀约">未邀约</option>
          <option value="__EMPTY__">未填写</option>
        </select>

        <label class="check-pill">
          <input id="conflictOnly" type="checkbox" />
          <span>仅看冲突 / 异常</span>
        </label>

        <button id="resetBtn" class="btn btn-ghost" type="button">重置</button>
      </div>

      <div class="legend-row" id="legendBar"></div>
    </section>

    <!-- Undated Events Alert Banner -->
    <section id="anomalyBanner" class="card anomaly-banner hidden"></section>

    <!-- Calendar View Container -->
    <main id="calendarRoot" class="card calendar-shell"></main>

    <!-- KPI Summary (placed below calendar so the schedule table stays unobstructed) -->
    <section class="kpi-grid" id="kpiBar"></section>

    <footer class="footer-note">
      由 GitHub Actions 自动同步并加密发布 · 本机解锁后自动记住密码，下次直接查看
    </footer>
  </div>

  <!-- Detail Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-head">
        <div>
          <div id="modalBadges" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
          <h2 id="modalTitle" class="modal-title"></h2>
        </div>
        <button id="closeModal" class="modal-close" type="button" aria-label="关闭">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
